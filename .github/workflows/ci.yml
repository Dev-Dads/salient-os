name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The verifier is stdlib-only and zero-dependency by design
      # (enforced by tests/test_discipline.py), so there is nothing to install.
      - name: Show Python
        run: python --version

      # Install bubblewrap so the "protection earns autonomy" contained-execution LIVE proof
      # (tests/test_collaborator_contained.py::ContainmentProofLinux) actually runs instead of silently
      # skipping — bwrap is NOT preinstalled on ubuntu-latest, and where it is absent
      # containment_available() is False (the honest fallback), so the proof would skip and certify
      # nothing. This is a system binary, not a Python dependency (the verifier stays stdlib-only).
      - name: Install bubblewrap + nftables (contained + egress-observer live proofs)
        run: sudo apt-get update && sudo apt-get install -y bubblewrap nftables

      # Let the ADR 0003 revisit-#1 netns isolation PROOF and the bwrap containment proof actually run:
      # Ubuntu 24.04 can block unprivileged user namespaces via AppArmor. Best-effort (|| true) — a no-op
      # where already permitted; without it the isolation/containment tests would just skip, not fail.
      - name: Enable unprivileged user namespaces (netns + bwrap containment tests)
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true

      # F1 regression guard (red-team): the containment LIVE proof is @skipUnless(containment_available),
      # so if containment breaks it SKIPS — and a skip reads as a PASS. That is exactly how the /etc/ssh
      # mask bug shipped "green" (probe False everywhere => proof skipped => nothing certified). Assert
      # containment IS available on this Linux job so any regression that disables it FAILS LOUDLY here,
      # instead of silently skipping the proof. (userns is enabled above and proven by the netns proof.)
      - name: Assert bwrap containment is available (no silent skip of the live proof)
        run: |
          python -c "import sys; from collaborator import contained; ok=contained.containment_available(); print('containment_available =', ok); sys.exit(0 if ok else 'bwrap containment unavailable on CI - the skipUnless live proof would silently skip and certify nothing; investigate before trusting green.')"

      # Same no-silent-skip guard for the ADR 0003 #1b INDEPENDENT egress observer (Thread #2): its LIVE
      # proof is @skipUnless(observer_available()==STRONG), so a broken strong tier would SKIP (= a false
      # pass). Assert the nft strong vantage is available on this Linux job (nftables installed + the
      # runner's passwordless sudo) so a regression fails loudly. The probe installs/reads/tears down its
      # own scoped table only — it never touches any other nft table and needs no outbound.
      - name: Assert nft egress observer strong tier is available (no silent skip)
        run: |
          python -c "import sys; from collaborator import egressobserver as eo; t=eo.observer_available(); print('egress observer tier =', t); sys.exit(0 if t==eo.TIER_STRONG else 'nft egress observer strong tier unavailable on CI - the skipUnless live proof would silently skip; investigate (nftables? passwordless sudo?) before trusting green.')"

      - name: Run test suite
        run: python -m unittest discover -s tests -v
