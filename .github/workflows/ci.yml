name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The verifier is stdlib-only and zero-dependency by design
      # (enforced by tests/test_discipline.py), so there is nothing to install.
      - name: Show Python
        run: python --version

      # Let the ADR 0003 revisit-#1 netns isolation PROOF actually run: Ubuntu 24.04 can block
      # unprivileged user namespaces via AppArmor. Best-effort (|| true) — a no-op where already
      # permitted; without it the isolation test would just skip, not fail.
      - name: Enable unprivileged user namespaces (netns isolation tests)
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true

      - name: Run test suite
        run: python -m unittest discover -s tests -v
